[project]
name = "loop-engineering-demo"
version = "0.1.0"
description = "Loop engineering demo: Deep Agents coding harness + pytest + config improvement"
requires-python = ">=3.11"
dependencies = [
    "langchain>=0.3.0",
    "langgraph>=0.2.0",
    "langchain-openai>=0.2.0",
    "pydantic>=2.0.0",
    "python-dotenv>=1.0.0",
    "fastapi>=0.139.0",
    "uvicorn[standard]>=0.51.0",
    "jinja2>=3.1.6",
    "deepagents>=0.6.12",
    "pytest>=8.0.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src"]

[dependency-groups]
dev = [
    "langgraph-api>=0.11.0",
    "langgraph-cli[inmem]>=0.1.0",
    "langgraph-sdk>=0.1.0",
]

[tool.uv]
default-groups = ["dev"]
